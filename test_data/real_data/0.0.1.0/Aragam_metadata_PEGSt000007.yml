  variant_or_gene_centric: gene-centric
  source_tag: source_pertub_mouse
  note: List of cardiovascular-relevant mouse phenotypes for gene knockouts of genes
    in genome-wide significant association regions. Columns describe the gene (including
    HGNC and Mouse Genome Informatics IDs), the mouse model ID and description, and
    the mouse phenotyping ID and description. The table is ordered alphabetically
