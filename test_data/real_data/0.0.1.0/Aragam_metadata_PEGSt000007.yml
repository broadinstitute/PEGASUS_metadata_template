- column_header: PHEWAS_UKBBDiseases
  column_description: 'Significant associations with diseases in UK Biobank are listed
    for each of the 241 conditionally independent genome-wide associations with CAD
    from the primary meta-analysis.  (+) and (-) denote direction of association with
    specified disease/trait, as oriented to the CAD risk-increasing allele. '
  evidence_category: PheWAS (Phenome-Wide Association Study)
  evidence_category_abbreviation: PHEWAS
  variant_or_gene_centric: variant-centric
  source_tag: source_ukbb
  method_tag: soft_phewas
  source:
    source_tag: source_ukbb
    provenance: UK Biobank
    doi: https://doi.org/10.1038/s41586-018-0579-z
    description: 'UK Biobank (UKB) is a prospective study of approximately 500,000
      individuals comprising

      members of the UK population aged 40-69 collected from multiple sites across
      the United

      Kingdom from 2006-2010 (14).'
  method:
    method_tag: soft_phewas
    method_mode: software
    method_mode_ontology_term_id: ECO_0000203
    method_description: 'For disease phenotypes, we performed logistic

      regression adjusted for age, sex, genotyping array, and the first five principal
      components. An

      association with a disease phenotype was deemed significant at a Bonferroni-corrected
      threshold

      of p-value<3.4x10-6 (53 diseases x 279 genetic variants). Continuous phenotypes
      were

      residualized after adjusting for age, sex, genotyping array, and the first five
      principal components;

      linear regression was performed on residuals following inverse-normal transformation'
- column_header: GENEBASE_Rare5SKATO
  column_description: P-value from gene-based association analysis using SKAT-O, aggregating
    rare variants (MAF≤ 0.05)
  evidence_category: Gene-based association
  evidence_category_abbreviation: GENEBASE
  variant_or_gene_centric: gene-centric
  method_tag: soft_skato
  note: '‘NA’ denotes that this gene could not be tested using this mask due to insufficient
    variants. including Missense, frameshift, stop gain, stop loss, splice site variants
    which MAF<5%                                                                                        '
  method:
    method_tag: soft_skato
    method_mode: software
    method_mode_ontology_term_id: ECO_0000203
