  variant_information: 279 significant associations from GWAS meta-analysis
  genome_build: ' GRCh37'
  info: All protein-coding genes within 500 kb of all 279 genome-wide association
Evidence:
- column_header: GWAS_Pvalue
  column_description: The p-value of association between the variant and the trait
    from GWAS.
  evidence_category: Genome-wide association (GWAS) signal
  evidence_category_abbreviation: GWAS
  variant_or_gene_centric: variant-centric
- column_header: GWAS_Beta
  column_description: The effect size estimate from GWAS; indicates the direction
