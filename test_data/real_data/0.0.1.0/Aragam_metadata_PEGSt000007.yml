- column_header: DB_ClinVar
  column_description: 'List of genes in CAD-associated regions for which pathogenic
    (or likely pathogenic) variants were found in ClinVar for phenotypes and disorders
    related to CAD. '
  evidence_category: Association from curated database
  evidence_category_abbreviation: DB
  variant_or_gene_centric: gene-centric
  source_tag: source_clinvar
  note: The report disease to the gene in the region harbors a variant that ClinVar
    classifies as having evidence for being pathogenic for a cardiovascular-relevant
    monogenic disorder
  source:
    source_tag: source_clinvar
    provenance: 'ClinVar '
    version: 44008
    url: https://www.ncbi.nlm.nih.gov/clinvar/
Integration:
- integration_tag: pops
  column_header: INT_pops_score
  column_description: 'PoPS score for all genes within a 500kb window of each of the
    279 sentinel genome-wide significant associations with CAD; and the top ten PoPS
    features contributing to the prioritization of each gene.                  '
  author_conclusion: false
  method_tag: soft_pops
  note: ' gene with highest PoPS score within 500kb of sentinel.              '
  method:
    method_tag: soft_pops
    method_mode: software
    method_mode_ontology_term_id: ECO_0007674
    software_name: PoPS
    software_doi: https://doi.org/10.1101/2020.09.08.20190561
- integration_tag: pops
  column_header: INT_pops_feature1
  column_description: top PoPS features contributing to the prioritisation of each
    gene.
  author_conclusion: false
  method_tag: soft_pops
  method:
    method_tag: soft_pops
    method_mode: software
    method_mode_ontology_term_id: ECO_0007674
    software_name: PoPS
    software_doi: https://doi.org/10.1101/2020.09.08.20190561
- integration_tag: nsupport
  column_header: INT_AuthorConclusion
  column_description: Number of evidence streams supprting the variant-gene pair to
    the phenotype
  author_conclusion: true
  evidence_streams_included: 'PROX | eQTL |

    GENEBASE |

    PERTUB |

    DB'
  integrations_included: pops
  method_tag: method_customised
  method:
    method_tag: method_customised
    method_mode: manual
    method_mode_ontology_term_id: ECO_0007673
    method_description: 'To systematically prioritize likely causal genes for all
      279 genome-wide associations, we integrated the following eight of the aforementioned
      similarity-based or locus-based predictors of causal genes: (1) the top two
      prioritized genes from PoPS; (2) genes with eQTLs in CAD-relevant tissues from
      STARNET or GTEx; (3) genes containing protein-altering variants that are in
      strong LD (r2 ≥ 0.8) with the CAD sentinel variant; (4) genes harboring variants
      responsible for monogenic disorders of cardiovascular relevance according to
      ClinVar; (5) genes containing rare coding variants that have been associated
      with CAD risk in previous WES or array-based studies; (6) genes encoding proteins
      of causal relevance to CAD per MR studies or that are targets for established
      cardiovascular drugs; (7) genes that display cardiovascular-relevant phenotypes
      in knock-out mice from the International Mouse Phenotyping Consortium or Mouse
      Genome Informatics database; and (8) the nearest gene to the CAD sentinel variant
      (Fig. 5a). We prioritized the most likely ‘causal gene’ for each association
      using a consensus-based approach, selecting the gene with the highest, unweighted
      sum of evidence across all eight predictors.'
