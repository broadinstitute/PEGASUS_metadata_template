DatasetDescription:
- trait_description: coronary artery disease
  trait_ontology_id: EFO_0001645
  peg_source: PMID:36474045
  gwas_source: GCST90132315
GenomicIdentifier:
- variant_type: significant
  variant_information: 279 significant associations from GWAS meta-analysis
  genome_build: GRCh37
  info: All protein-coding genes within 500 kb of all 279 genome-wide association
Evidence:
- column_header: GWAS_beta
  column_description: The effect size estimate from GWAS; indicates the direction
    and magnitude of the allele’s effect on the trait.
  evidence_category: Genome-wide association (GWAS) signal
  evidence_category_abbreviation: GWAS
  variant_or_gene_centric: variant-centric
- column_header: GWAS_pvalue
  column_description: The p-value of association between the variant and the trait
    from GWAS.
  evidence_category: Genome-wide association (GWAS) signal
  evidence_category_abbreviation: GWAS
  variant_or_gene_centric: variant-centric
- column_header: PROX
  column_description: If the gene is the nearest gene to the CAD sentinel variant.
  evidence_category: Proximity to gene (distance)
  evidence_category_abbreviation: PROX
  variant_or_gene_centric: variant-centric
  note: "Summary of the tissue-specific enrichment and functionally-informed fine-mapped\
    \ for the 127 regions enriched in at least one of the ten enriched CAD-relevant\
    \ tissues. Enrichments showing a >3SD increment in Bayes Factor (BF) are highlighted\
    \ in red. \nNULLBF = Bayes Factor under the null model; BESTBFJUMP = maximum increment\
    \ (i.e. enrichment) observed across the ten tissues; PPA = posterior probability\
    \ of association; HUVEC = human umbilical vein endothelial cells; HSMM = human\
    \ skeletal muscle myoblasts."
- column_header: FUNC_VEP_consequence
  column_description: Functional consequence of the variant predicted by Ensembl VEP.
    This column includes only protein altering consequence.
  evidence_category: Predicted functional impact
  evidence_category_abbreviation: FUNC
  variant_or_gene_centric: variant-centric
  method_tag: soft_vep
  threshold: protein-altering
  method:
    method_tag: soft_vep
    method_mode: software
    method_mode_ontology_term_id: ECO_0000203
    software_name: Ensembl VEP
    software_version: v96.0
    software_url: https://www.ensembl.org/info/docs/tools/vep/index.html
- column_header: QTL_eQTL_summary
  column_description: Binary indicator of whether there is evidence of a significant
    eQTL association in any evaluated GTEx or STARNET tissue. A value of 1 indicates
    that at least one GTEx or STARNET tissue showed a significant eQTL association
    for the locus/gene; a value of 0 indicates that no significant eQTL association
    was identified in the evaluated tissues.
  evidence_stream_tag: eQTL
  evidence_category: Molecular QTL
  evidence_category_abbreviation: QTL
  variant_or_gene_centric: variant-centric
- column_header: QTL_eQTL_gtex_Adipose_Subcutaneous_pvalue
  column_description: Nominal P-value for the association between genotype and gene
    expression in GTEx subcutaneous adipose tissue.
  evidence_stream_tag: eQTL
  evidence_category: Molecular QTL
  evidence_category_abbreviation: QTL
  variant_or_gene_centric: variant-centric
  source_tag: source_eqtl_gtex_AdiposeSubcutaneous
  method_tag: soft_eqtl
  threshold: FDR<5%
  note: 'eQTL look-ups from CAD-relevant tissues (adipose [subcutaneous, visceral
    omentum], adrenal gland, artery [aorta, coronary, tibial], liver and whole blood)
    in GTEx v7. Associations are only shown where the eQTL reached a 5% false-discovery
    rate threshold and the lead eQTL variant was in high LD (r2≥0.8) with the CAD
    sentinel variant.  Nominal P values were estimated using a two-tailed t-test.

    eQTL = expression quantitative trait locus.'
  source:
    source_tag: source_eqtl_gtex_AdiposeSubcutaneous
    provenance: GTEx
    version: v7
    url: https://www.gtexportal.org/home/datasets
    sample_origin: primary-tissue
    tissue: Adipose Subcutaneous
    cell_type: mixed
    life_stage: adult
    sex: mixed
    species: human
  method:
    method_tag: soft_eqtl
    method_mode: software
    method_mode_ontology_term_id: ECO_0000203
    method_description: 'We cross-referenced the sentinel CAD variants and their proxies
      (r2≥0.8) with STARNET eQTLs

      reaching a 5% FDR for all tissues. To ensure the CAD association and eQTL are
      likely to be

      driven by the same causal variant, we retained only those eQTLs where the CAD-associated

      variant and the lead eQTL variant had r2≥0.8 among European ancestry participants
      from UK

      Biobank. '
