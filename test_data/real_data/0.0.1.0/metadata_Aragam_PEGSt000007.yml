- integration_tag: n_predictors
  column_header: INT_n_predictors
  column_description: Number of evidence streams supporting the variant-gene pair
    for the phenotype.
  author_conclusion: false
  evidence_streams_included: PROX | QTL | FUNC | LIT | PERTURB | DB
  integrations_included: pops
  method_tag: method_customised
  note: Unweighted count of the eight evidence predictors described by the publication.
  method:
    method_tag: method_customised
    method_mode: manual
    method_mode_ontology_term_id: ECO_0007674
    method_description: 'To systematically prioritize likely causal genes for all
      279 genome-wide associations, we integrated the following eight of the aforementioned
      similarity-based or locus-based predictors of causal genes: (1) the top two
      prioritized genes from PoPS; (2) genes with eQTLs in CAD-relevant tissues from
      STARNET or GTEx; (3) genes containing protein-altering variants that are in
      strong LD (r2 ≥ 0.8) with the CAD sentinel variant; (4) genes harboring variants
      responsible for monogenic disorders of cardiovascular relevance according to
      ClinVar; (5) genes containing rare coding variants that have been associated
      with CAD risk in previous WES or array-based studies; (6) genes encoding proteins
      of causal relevance to CAD per MR studies or that are targets for established
      cardiovascular drugs; (7) genes that display cardiovascular-relevant phenotypes
      in knock-out mice from the International Mouse Phenotyping Consortium or Mouse
      Genome Informatics database; and (8) the nearest gene to the CAD sentinel variant
      (Fig. 5a). We prioritized the most likely ‘causal gene’ for each association
      using a consensus-based approach, selecting the gene with the highest, unweighted
      sum of evidence across all eight predictors.'
